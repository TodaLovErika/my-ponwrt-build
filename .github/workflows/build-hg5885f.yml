name: Build PonWrt HG5885F

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  UPLOAD_BIN_DIR: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间并安装构建环境
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file \
            u-boot-tools libelf-dev libfuse-dev squashfs-tools device-tree-compiler libcap-dev
          sudo -E apt-get -qq clean

      - name: 克隆 PonWrt 源码
        run: |
          git clone --depth 1 \(REPO_URL -b\)REPO_BRANCH ponwrt

      - name: 更新并加载 Feeds
        run: |
          cd ponwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 HG5885F 定制配置
        run: |
          cd ponwrt
          if [ -f "$GITHUB_WORKSPACE/hg5885f.config" ]; then
            cp $GITHUB_WORKSPACE/hg5885f.config .config
          else
            cat >> .config <> $GITHUB_OUTPUT
          echo "BUILD_DATE=\((date +"%Y%m%d%H%M")" >>\)GITHUB_ENV

      - name: 整理输出固件
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          cd ponwrt/bin/targets/*/* || cd ponwrt/bin || true
          find . -maxdepth 1 -type f \(-name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.manifest"\) -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
          cd $GITHUB_WORKSPACE/firmware
          sha256sum * > sha256sums.txt
          echo "FIRMWARE_PATH=\(GITHUB_WORKSPACE/firmware" >>\)GITHUB_ENV

      - name: 上传固件至 Actions 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt_HG5885F_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE_PATH }}

      - name: 发布 Release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: PonWrt_HG5885F_${{ env.BUILD_DATE }}
          files: ${{ env.FIRMWARE_PATH }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
